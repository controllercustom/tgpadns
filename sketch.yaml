profiles:
  atoms3:
    fqbn: esp32:esp32:m5stack_atoms3:PartitionScheme=default_8MB,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: lib/ESP32nslite
      - dir: lib/WiFiManager
      - dir: lib/WebSockets
      - dir: lib/M5GFX

  esp32s3:
    fqbn: esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: lib/ESP32nslite
      - dir: lib/WiFiManager
      - dir: lib/WebSockets

default_profile: atoms3
